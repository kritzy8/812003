<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kritzy_8 | Graphic Designer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #0f0f1e 0%,
          #1a1a3e 50%,
          #0d0d2b 100%
        );
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(100, 50, 200, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(50, 100, 200, 0.1) 0%,
            transparent 50%
          );
        pointer-events: none;
        filter: blur(50px);
        z-index: 0;
      }

      .container {
        max-width: 1200px;
        width: 90%;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 60px 40px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        text-align: center;
        color: white;
      }

      h1 {
        font-size: 3.5em;
        margin-bottom: 10px;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .subtitle {
        font-size: 1.3em;
        margin-bottom: 30px;
        opacity: 0.85;
        font-weight: 300;
      }

      .divider {
        width: 80px;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.5),
          transparent
        );
        margin: 20px auto 30px;
      }

      .description {
        font-size: 1.1em;
        margin-bottom: 40px;
        line-height: 1.6;
        opacity: 0.9;
      }

      .buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 30px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1em;
        backdrop-filter: blur(10px);
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.6);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      .btn-primary {
        background: rgba(255, 255, 255, 0.12);
      }

      .btn-primary:hover {
        background: rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="glass-card">
        <h1>kritzy_8</h1>
        <p class="subtitle">Graphic Designer</p>
        <div class="divider"></div>
        <p class="description">
          Creating stunning visual designs that bring your ideas to life.
          Specializing in branding, digital art, and creative solutions.
        </p>
        <div class="buttons">
          <a href="#portfolio" class="btn btn-primary">View Portfolio</a>
          <a href="#contact" class="btn">Get in Touch</a>
        </div>
      </div>
    </div>
  </body>
</html>
